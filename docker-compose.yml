services:
  web:
    build: .
    container_name: akademik_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mongodb
    restart: unless-stopped
  mongodb:
    image: mongo:7
    container_name: akademik_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: akademik
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
volumes:
  mongodb_data:
